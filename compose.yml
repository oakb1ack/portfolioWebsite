services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${PORTFOLIO_DATA_ROOT}/postgres:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks: [private]
    security_opt: [no-new-privileges:true]

  migrate:
    image: docker.io/library/postgres:17-alpine
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    volumes:
      - ./backend/migrations:/migrations:ro,Z
      - ./deploy/run-migrations.sh:/run-migrations.sh:ro,Z
    entrypoint: ["/bin/sh", "/run-migrations.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      APP_ENV: production
      API_ADDRESS: ${API_ADDRESS:-:8080}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      MEDIA_ROOT: /var/lib/portfolio/media
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-__Host-portfolio_session}
      CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-__Host-portfolio_csrf}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-12h}
      SESSION_IDLE_TIMEOUT: ${SESSION_IDLE_TIMEOUT:-2h}
      TRUSTED_PROXY_MODE: ${TRUSTED_PROXY_MODE:-cloudflare}
      HEALTHCHECK_URL: http://127.0.0.1:8080/api/v1/healthz
    volumes:
      - ${PORTFOLIO_DATA_ROOT}/media:/var/lib/portfolio/media:Z
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/portfolio-api", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [private]
    security_opt: [no-new-privileges:true]

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [private]
    security_opt: [no-new-privileges:true]

  caddy:
    image: docker.io/library/caddy:2.10.0-alpine
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,Z
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header=\"Host: $${PUBLIC_HOST}\" http://127.0.0.1/api/v1/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [edge, private]
    security_opt: [no-new-privileges:true]

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2025.7.0
    restart: unless-stopped
    read_only: true
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      CLOUDFLARE_TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      caddy:
        condition: service_healthy
    networks: [edge]
    security_opt: [no-new-privileges:true]

networks:
  edge:
  private:
    internal: true

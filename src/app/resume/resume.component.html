<section class="resume-page" aria-labelledby="resume-title">
  <header class="resume-heading">
    <div>
      <h1 id="resume-title">My experience</h1>
    </div>

    <a class="download-button" [href]="resumeUrl" download>
      <span>Download PDF</span>
      <span aria-hidden="true">↓</span>
    </a>
  </header>

  <div class="resume-viewer">
    <div
      #resumeDocument
      class="resume-document"
      [attr.data-render-state]="renderState()"
      [attr.data-render-error]="renderError()"
    >
      <img
        class="resume-fallback"
        [src]="resumePreviewUrl"
        alt="Preview of Ali Alfridawi's Resume"
        [attr.aria-hidden]="renderState() === 'ready' ? 'true' : null"
      />
      <canvas
        #resumeCanvas
        class="resume-canvas"
        [class.is-ready]="renderState() === 'ready'"
        [attr.aria-hidden]="renderState() === 'ready' ? null : 'true'"
        aria-label="Rendered preview of Ali Alfridawi's Resume"
      ></canvas>
    </div>
  </div>
</section>

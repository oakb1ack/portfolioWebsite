<a class="project-card" [routerLink]="['/projects', project().slug]">
  <div class="project-preview">
    <div class="browser-bar" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="preview-viewport">
      @if (project().featured_media_id; as mediaId) {
        <img [src]="mediaUrls.publicUrl(mediaId)" [alt]="'Preview of ' + project().title" />
      } @else {
        <span class="project-monogram" aria-hidden="true">
          {{ project().title.charAt(0) }}
        </span>
      }
    </div>
  </div>

  <div class="card-content">
    <div class="card-title">
      <h2>{{ project().title }}</h2>
      <span class="card-arrow" aria-hidden="true">↗</span>
    </div>
    <p class="summary">{{ project().summary }}</p>
    @if (project().technologies?.length) {
      <ul class="technology-list" aria-label="Technologies">
        @for (technology of project().technologies; track technology) {
          <li>{{ technology }}</li>
        }
      </ul>
    }
  </div>
</a>
